<svg viewBox="0 0 1280 860" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1280" height="860" fill="#ffffff"/>
  <text x="40" y="34" font-size="19" font-weight="700" fill="#0f172a">Custom Domains — Architecture</text>
  <text x="330" y="34" font-size="12.5" fill="#64748b">how customer1.net reaches a container: DNS verification, ACME, pfSense/HAProxy, controller &amp; agent</text>

  <!-- ===== external: top lane ===== -->
  <rect x="790" y="20" width="200" height="56" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="890" y="42" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Customer DNS (registrar)</text>
  <text x="890" y="60" font-size="11.5" fill="#475569" text-anchor="middle">TXT _nordkraft-challenge · A record</text>

  <rect x="1020" y="20" width="220" height="56" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="1130" y="42" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Customer laptop</text>
  <text x="1130" y="60" font-size="11.5" fill="#475569" text-anchor="middle">nordkraft CLI · WireGuard client</text>

  <!-- ===== external: left column ===== -->
  <rect x="40" y="110" width="180" height="64" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="130" y="136" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Let's Encrypt</text>
  <text x="130" y="156" font-size="11.5" fill="#475569" text-anchor="middle">ACME CA · HTTP-01</text>

  <rect x="40" y="300" width="180" height="72" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="130" y="328" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Visitor</text>
  <text x="130" y="348" font-size="11.5" fill="#475569" text-anchor="middle">http(s)://customer1.net</text>

  <!-- ===== pfSense ===== -->
  <rect x="290" y="100" width="380" height="600" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="306" y="126" font-size="14" font-weight="700" fill="#92400e">pfSense — Netgate 4200 (edge)</text>

  <rect x="306" y="138" width="128" height="24" rx="12" fill="#fde68a"/>
  <text x="370" y="154" font-size="11.5" font-weight="600" fill="#78350f" text-anchor="middle">WAN  :80 / :443</text>

  <rect x="306" y="174" width="348" height="88" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="318" y="194" font-size="12.5" font-weight="700" fill="#0f172a">http_frontend  :80</text>
  <text x="318" y="214" font-size="11.5" fill="#334155">path ACL /.well-known/acme-challenge/* → listener</text>
  <text x="318" y="232" font-size="11.5" fill="#334155">per-domain host ACL → 301 https (excl. ACME paths)</text>
  <text x="318" y="250" font-size="11.5" fill="#334155">platform ACME rule host-scoped (coexistence)</text>

  <rect x="306" y="276" width="348" height="74" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="318" y="296" font-size="12.5" font-weight="700" fill="#0f172a">https_frontend  :443</text>
  <text x="318" y="316" font-size="11.5" fill="#334155">SNI selects the per-domain LE certificate</text>
  <text x="318" y="334" font-size="11.5" fill="#334155">exact Host ACL (never wildcard) → domain backend</text>

  <rect x="306" y="366" width="348" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="318" y="386" font-size="12.5" font-weight="700" fill="#0f172a">Certificate store</text>
  <text x="318" y="404" font-size="11.5" fill="#334155">one Let's Encrypt cert per custom domain</text>

  <rect x="306" y="434" width="348" height="96" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="318" y="454" font-size="12.5" font-weight="700" fill="#0f172a">Backend  cd_&lt;id&gt;_&lt;domain&gt;</text>
  <text x="318" y="474" font-size="11.5" fill="#334155">server = container IP : port (no health check needed)</text>
  <text x="318" y="492" font-size="11.5" fill="#334155">static route 172.21.x.y/32 → node LAN IP</text>
  <text x="318" y="510" font-size="11.5" fill="#334155">isolated per domain — deletion never touches siblings</text>

  <rect x="306" y="560" width="348" height="26" rx="13" fill="#fde68a"/>
  <text x="480" y="577" font-size="11.5" font-weight="600" fill="#78350f" text-anchor="middle">:8443  pfSense REST API v2</text>

  <text x="480" y="622" font-size="11" fill="#92400e" text-anchor="middle">every per-domain object is created, read back</text>
  <text x="480" y="638" font-size="11" fill="#92400e" text-anchor="middle">and self-healed by the controller — never by hand</text>

  <!-- ===== controller ===== -->
  <rect x="760" y="100" width="480" height="360" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="776" y="126" font-size="14" font-weight="700" fill="#065f46">Controller — rasp2 · container-api (one binary)</text>
  <text x="1224" y="126" font-size="11" fill="#047857" text-anchor="end">:51820 WireGuard</text>

  <rect x="776" y="140" width="448" height="40" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="788" y="165" font-size="11.5" fill="#334155"><tspan font-weight="700" fill="#0f172a">:8001  API</tspan> — WireGuard-only (wg0 172.20.0.254), all authenticated endpoints</text>

  <rect x="776" y="192" width="448" height="56" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="788" y="212" font-size="11.5" fill="#334155"><tspan font-weight="700" fill="#0f172a">:8801  ACME challenge listener</tspan> — LAN-facing, second socket</text>
  <text x="788" y="230" font-size="11.5" fill="#334155">one route only · in-memory tokens · nftables: allow pfSense only</text>

  <rect x="776" y="262" width="448" height="60" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="788" y="282" font-size="11.5" fill="#334155"><tspan font-weight="700" fill="#0f172a">Domain reconciler</tspan> — 60 s loop, retries with backoff</text>
  <text x="788" y="300" font-size="11.5" fill="#334155">DNS verifier (authoritative) · ACME client · pfSense client</text>

  <rect x="776" y="336" width="448" height="76" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="788" y="356" font-size="11.5" fill="#334155"><tspan font-weight="700" fill="#0f172a">PostgreSQL — custom_domains</tspan> (state machine, UNIQUE(domain))</text>
  <text x="788" y="374" font-size="11.5" fill="#334155">pending_dns → dns_verified → issuing_cert → cert_ready →</text>
  <text x="788" y="392" font-size="11.5" fill="#334155">activating → active   (renewal 30 d before expiry · drift repair · degraded → teardown)</text>

  <!-- ===== agent ===== -->
  <rect x="760" y="560" width="480" height="150" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="776" y="586" font-size="14" font-weight="700" fill="#075985">Agent node — e.g. ry-optiplex-1 (any node)</text>
  <rect x="776" y="600" width="448" height="56" rx="6" fill="#ffffff" stroke="#bae6fd"/>
  <text x="788" y="622" font-size="11.5" fill="#334155"><tspan font-weight="700" fill="#0f172a">Kata container</tspan> — customer app (isolated micro-VM)</text>
  <text x="788" y="640" font-size="11.5" fill="#334155">172.21.x.y : port — per-tenant macvlan + nftables</text>
  <text x="1000" y="684" font-size="11" fill="#0369a1" text-anchor="middle">NATS ⇄ controller — orchestration only (not in the domain data path)</text>

  <!-- ===== arrows ===== -->
  <!-- 1 laptop -> controller -->
  <line x1="1130" y1="76" x2="1130" y2="100" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- 2 controller -> DNS -->
  <line x1="890" y1="100" x2="890" y2="76" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- 3 controller -> LE (order) -->
  <path d="M770,100 L770,88 L130,88 L130,110" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- 4 LE -> pfSense :80 -->
  <line x1="220" y1="150" x2="290" y2="200" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- 5 pfSense -> controller :8801 -->
  <line x1="670" y1="214" x2="760" y2="222" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- 6 controller -> pfSense :8443 -->
  <path d="M760,300 L715,300 L715,573 L670,573" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- 7 visitor -> pfSense :443 -->
  <line x1="220" y1="336" x2="290" y2="320" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- 8 pfSense backend -> agent container -->
  <path d="M670,500 L727,500 L727,628 L760,628" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- badges -->
  <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="1146" cy="88" r="10" fill="#111827"/><text x="1146" y="92">1</text>
    <circle cx="874" cy="88" r="10" fill="#111827"/><text x="874" y="92">2</text>
    <circle cx="450" cy="88" r="10" fill="#111827"/><text x="450" y="92">3</text>
    <circle cx="244" cy="166" r="10" fill="#111827"/><text x="244" y="170">4</text>
    <circle cx="712" cy="204" r="10" fill="#111827"/><text x="712" y="208">5</text>
    <circle cx="715" cy="436" r="10" fill="#111827"/><text x="715" y="440">6</text>
    <circle cx="248" cy="314" r="10" fill="#111827"/><text x="248" y="318">7</text>
    <circle cx="727" cy="562" r="10" fill="#111827"/><text x="727" y="566">8</text>
  </g>

  <!-- ===== legend ===== -->
  <text x="40" y="752" font-size="13" font-weight="700" fill="#0f172a">Flows</text>
  <g font-size="12" fill="#334155">
    <text x="40" y="774"><tspan font-weight="700">1</tspan>  nordkraft domain add — CLI over WireGuard (:51820) to the API (:8001)</text>
    <text x="40" y="794"><tspan font-weight="700">2</tspan>  reconciler verifies TXT token + A record on the domain's authoritative nameservers</text>
    <text x="40" y="814"><tspan font-weight="700">3</tspan>  ACME order to Let's Encrypt (staging or production)</text>
    <text x="40" y="834"><tspan font-weight="700">4</tspan>  Let's Encrypt fetches the HTTP-01 challenge on WAN :80</text>
    <text x="660" y="774"><tspan font-weight="700">5</tspan>  HAProxy path-ACL forwards the challenge to the :8801 listener</text>
    <text x="660" y="794"><tspan font-weight="700">6</tspan>  REST API :8443 — cert upload, SNI bind, host ACL, backend, static route</text>
    <text x="660" y="814"><tspan font-weight="700">7</tspan>  visitor :443 → SNI cert → exact host ACL → backend  (:80 → 301 https)</text>
    <text x="660" y="834"><tspan font-weight="700">8</tspan>  backend → static route → container 172.21.x.y:port on the agent node</text>
  </g>
</svg>
