[package]
name = "container-api"
version = "0.3.50"
edition = "2021"

[dependencies]
rocket = { version = "0.5", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
reqwest = { version = "0.11", features = ["json", "stream"] }
rand = "0.8"
async-nats = "0.33"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
openssl = { version = "0.10", features = ["vendored"] }
dotenv = "0.15.0"
libc = "0.2.177"
async-trait = "0.1.89"
toml = "0.8"
# Registry pull credentials (Docker config.json "auth" field)
base64 = "0.22"

# Custom domains (BYO-domain ingress): DNS verification + ACME issuance
hickory-resolver = "0.24"
# 0.8.5+ required: 0.7 fails to deserialize Let's Encrypt challenge types
# without a token (e.g. dns-persist-01) — hit in production Sep 2026.
instant-acme = "0.8.5"
x509-parser = "0.16"
idna = "1"
psl = "2"

# Sandbox exec/PTY: containerd gRPC (Task.Exec) on the agent, WebSocket stream
# relayed through the controller — kubectl/kubelet model, nothing over NATS.
containerd-client = "0.9"
tonic = "0.14"
prost-types = "0.14"
prost = "0.14"
rocket_ws = "0.1.1"
tokio-tungstenite = "0.21"
nix = { version = "0.31", features = ["term", "fs"] }
