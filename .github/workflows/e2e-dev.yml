name: E2E dev node

# Installs a dev node on a clean Ubuntu runner with the installer, builds the
# CLI, and runs scripts/smoke-dev.sh against it: deploy, published ports,
# port allocation, logs, stop/start, rm --force, reset. No mocks.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (clippy, fmt, shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            container-api
            client-cli
      # container-api/.cargo/config.toml names cross-compiler binaries;
      # point them at the native toolchain.
      - name: Native toolchain shims
        run: |
          for t in gcc g++ ar; do sudo ln -sf /usr/bin/$t /usr/local/bin/x86_64-unknown-linux-gnu-$t; done
      - name: shellcheck
        run: |
          sudo apt-get install -y -qq shellcheck protobuf-compiler >/dev/null
          shellcheck -S warning scripts/*.sh
      - name: clippy (container-api)
        run: cd container-api && cargo clippy --all-targets -- -D warnings
      - name: clippy (client-cli)
        run: cd client-cli && cargo clippy --all-targets -- -D warnings
      - name: fmt (container-api)
        run: cd container-api && cargo fmt --check
      - name: unit tests
        run: cd container-api && cargo test
      # nordkraft-sandboxd: static musl binary linked with rustup's rust-lld (no musl-gcc needed)
      - name: clippy + fmt + tests (sandboxd)
        run: |
          cd sandboxd
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/sandboxd | grep -q 'static'

  e2e:
    name: Install dev node + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rust (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            container-api
            client-cli

      # The repo's .cargo/config.toml names cross-compiler binaries; point
      # them at the native toolchain (the installer does the same).
      - name: Native toolchain shims
        run: |
          for t in gcc g++ ar; do sudo ln -sf /usr/bin/$t /usr/local/bin/x86_64-unknown-linux-gnu-$t; done

      - name: Build CLI
        run: cd client-cli && cargo build --release

      # Build the node here, where rust-cache keeps the target dir, rather than
      # letting the installer build cold in /var/tmp (containerd-client alone
      # is minutes on a 2-core runner). Same binary, same install path.
      - name: Build container-api
        run: |
          sudo apt-get install -y -qq protobuf-compiler >/dev/null
          cd container-api && cargo build --release

      - name: Install dev node
        run: sudo bash scripts/install-node.sh --dev --binary "$PWD/container-api/target/release/container-api"

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8001/api/status && break
            sleep 1
          done

      - name: WebSocket client for the PTY check
        run: pip3 install --quiet --break-system-packages websockets

      - name: Smoke test
        env:
          NK: ${{ github.workspace }}/client-cli/target/release/nordkraft
          API: http://127.0.0.1:8001/api
          HOST: 127.0.0.1
          IMAGE: nginx:alpine
          EXPECT: nginx
        run: bash scripts/smoke-dev.sh

      - name: Node logs on failure
        if: failure()
        run: sudo journalctl -u nordkraft-node -n 200 --no-pager

      - name: Snapshot diff on failure
        if: failure()
        run: git diff --no-color tests/snapshots || true
