name: Release Container API to Public Repo

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            musl: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            musl: aarch64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-aarch64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Rust (pinned by rust-toolchain.toml)
      run: rustup show active-toolchain || rustup toolchain install

    - name: Install cross-compilation tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y gcc-x86-64-linux-gnu gcc-aarch64-linux-gnu protobuf-compiler

    - name: Build binary
      env:
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: x86_64-linux-gnu-gcc
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      run: |
        cd container-api
        cargo build --release --target ${{ matrix.target }}

        mkdir -p ../dist/${{ matrix.platform }}
        cp target/${{ matrix.target }}/release/container-api ../dist/${{ matrix.platform }}/nordkraft

        # nordkraft-sandboxd: static musl, linked with rustup's rust-lld (sandboxd/.cargo/config.toml)
        cd ../sandboxd
        cargo build --release --target ${{ matrix.musl }}
        file target/${{ matrix.musl }}/release/sandboxd | grep -q static
        cp target/${{ matrix.musl }}/release/sandboxd ../dist/${{ matrix.platform }}/sandboxd

        # Checksums
        cd ../dist/${{ matrix.platform }}
        sha256sum nordkraft > nordkraft.sha256
        sha256sum sandboxd > sandboxd.sha256

        # Tarball
        cd ..
        tar -czf nordkraft-${{ matrix.platform }}.tar.gz -C ${{ matrix.platform }} nordkraft nordkraft.sha256 sandboxd sandboxd.sha256

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nordkraft-${{ matrix.platform }}
        path: dist/nordkraft-${{ matrix.platform }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist/

    - name: Prepare release assets
      run: |
        # download-artifact@v4 puts each artifact in its own subdir — flatten first
        find dist/ -name "*.tar.gz" -exec mv {} dist/ \;

        # Extract raw binaries from tarballs so install.sh can curl them directly
        for f in dist/nordkraft-linux-*.tar.gz; do
          [ -f "$f" ] || continue
          platform=$(basename "$f" .tar.gz | sed 's/nordkraft-//')

          # Extract to a temp dir to avoid clobbering other files
          tmpdir=$(mktemp -d)
          tar -xzf "$f" -C "$tmpdir"

          # Binary may be at root or one level deep — find it
          binary=$(find "$tmpdir" -name "nordkraft" -not -name "*.sha256" | head -1)
          checksum=$(find "$tmpdir" -name "nordkraft.sha256" | head -1)

          [ -f "$binary" ]   && cp "$binary"   "dist/nordkraft-${platform}"
          [ -f "$checksum" ] && cp "$checksum" "dist/nordkraft-${platform}.sha256"

          # The sandbox daemon travels in the same tarball; install-node.sh curls it by name
          sbx=$(find "$tmpdir" -name "sandboxd" -not -name "*.sha256" | head -1)
          sbxsum=$(find "$tmpdir" -name "sandboxd.sha256" | head -1)
          [ -f "$sbx" ]    && cp "$sbx"    "dist/sandboxd-${platform}"
          [ -f "$sbxsum" ] && cp "$sbxsum" "dist/sandboxd-${platform}.sha256"

          rm -rf "$tmpdir"
        done

        echo "=== dist/ contents ==="
        ls -la dist/

    - name: Copy schema.sql for install.sh
      run: cp database/schema.sql dist/schema.sql || true

    - name: Create Release on Public Repo
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: NordKraft ${{ github.ref_name }}
        body: |
          ## NordKraft ${{ github.ref_name }}

          Container orchestration API and server binary.

          ### Server Installation

          ```bash
          curl -fsSL https://install.nordkraft.io/server | sudo bash
          ```

          ### Manual Download

          | Platform | Binary | Checksum |
          |----------|--------|----------|
          | Linux x86_64 | nordkraft-linux-x86_64 | nordkraft-linux-x86_64.sha256 |
          | Linux aarch64 (Pi/ARM) | nordkraft-linux-aarch64 | nordkraft-linux-aarch64.sha256 |
          | Sandbox daemon x86_64 | sandboxd-linux-x86_64 | sandboxd-linux-x86_64.sha256 |
          | Sandbox daemon aarch64 | sandboxd-linux-aarch64 | sandboxd-linux-aarch64.sha256 |

          `sandboxd` is PID 1 of `nordkraft deploy --sandbox` containers; the installer puts it at
          `/opt/nordkraft/sandboxd/sandboxd`.

          ### Updating an existing server

          ```bash
          sudo nordkraft-update
          ```

          Containers keep running during updates.
        files: |
          dist/nordkraft-*.tar.gz
          dist/nordkraft-linux-x86_64
          dist/nordkraft-linux-x86_64.sha256
          dist/nordkraft-linux-aarch64
          dist/nordkraft-linux-aarch64.sha256
          dist/sandboxd-linux-x86_64
          dist/sandboxd-linux-x86_64.sha256
          dist/sandboxd-linux-aarch64
          dist/sandboxd-linux-aarch64.sha256
          dist/schema.sql
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
