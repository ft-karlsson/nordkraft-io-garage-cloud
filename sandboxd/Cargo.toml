[package]
name = "nordkraft-sandboxd"
version = "0.1.0"
edition = "2021"
description = "Nordkraft in-sandbox daemon: PID 1 of a sandbox container, serving exec, streams, PTYs and files over HTTP"
license = "AGPL-3.0-only"

[[bin]]
name = "sandboxd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "io-util", "fs", "net", "sync", "time"] }
axum = { version = "0.7", features = ["ws", "query", "json", "macros"] }
tower-http = { version = "0.5", features = ["trace"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.29", features = ["term", "process", "signal", "fs", "user"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
